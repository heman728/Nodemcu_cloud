<!DOCTYPE html>
<html>
<head>
  <title>Realtime LED Classroom Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>

  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
      margin:0;
      background: linear-gradient(135deg,#1f4037,#99f2c8);
      text-align:center;
      color:white;
    }
    .card{
      background:white;
      color:#333;
      margin:15px;
      padding:20px;
      border-radius:15px;
      box-shadow:0 4px 10px rgba(0,0,0,0.3);
    }
    input{
      padding:10px;
      font-size:18px;
      border-radius:8px;
      border:1px solid #ccc;
      width:70%;
      max-width:250px;
    }
    button{
      padding:12px 18px;
      font-size:16px;
      border:none;
      border-radius:8px;
      margin:5px;
      cursor:pointer;
      color:white;
    }
    .on{ background:#28a745; }
    .off{ background:#dc3545; }
    .start{ background:#007bff; width:80%; max-width:300px; }
    h2{ margin-top:10px; }
    #leaderboard div{
      text-align:left;
      padding:5px;
      border-bottom:1px solid #ddd;
    }
  </style>
</head>

<body>

<h2>⚡ Classroom Realtime LED Control ⚡</h2>

<!-- Name Entry -->
<div class="card" id="nameCard">
  <h3>Enter Your Name (Max 10 chars)</h3>
  <input id="username" maxlength="10" placeholder="Your Name">
  <br><br>
  <button class="start" onclick="startControl()">Start Control</button>
</div>

<!-- LED Control -->
<div id="controlPanel" style="display:none;">

  <div class="card">
    <h3 id="led1status">LED1</h3>
    <p id="led1by"></p>
    <button class="on" onclick="setLED('led1',1)">ON</button>
    <button class="off" onclick="setLED('led1',0)">OFF</button>
  </div>

  <div class="card">
    <h3 id="led2status">LED2</h3>
    <p id="led2by"></p>
    <button class="on" onclick="setLED('led2',1)">ON</button>
    <button class="off" onclick="setLED('led2',0)">OFF</button>
  </div>

  <div class="card">
    <h3>🏆 Leaderboard (Most Toggles)</h3>
    <div id="leaderboard"></div>
  </div>

</div>

<script>
var firebaseConfig = {
  databaseURL: "https://nodemcu-92161-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var userName = "";

// Start after name entry
function startControl(){
  var name = document.getElementById("username").value.trim();
  if(name.length == 0) return alert("Enter name!");
  userName = name;

  db.ref("Name").set(userName);

  document.getElementById("nameCard").style.display="none";
  document.getElementById("controlPanel").style.display="block";
}

// Correct toggle logic
function setLED(led, state){
  var ref = db.ref(led);
  ref.once("value", function(snapshot){
    var current = snapshot.val();

    // Count only if state changes
    if(current !== state){
      ref.set(state);
      db.ref("lastBy/"+led).set(userName);

      var countRef = db.ref("count/"+userName);
      countRef.transaction(function(c){
        return (c||0)+1;
      });
    }
  });
}

// LED status display
db.ref("led1").on("value", function(s){
  document.getElementById("led1status").innerHTML =
    s.val()? "LED1 is ON":"LED1 is OFF";
});
db.ref("led2").on("value", function(s){
  document.getElementById("led2status").innerHTML =
    s.val()? "LED2 is ON":"LED2 is OFF";
});

// Who changed last
db.ref("lastBy/led1").on("value", function(s){
  document.getElementById("led1by").innerHTML =
    "Last changed by: "+ (s.val()||"-");
});
db.ref("lastBy/led2").on("value", function(s){
  document.getElementById("led2by").innerHTML =
    "Last changed by: "+ (s.val()||"-");
});

// Leaderboard
db.ref("count").on("value", function(s){
  var data = s.val() || {};
  var html = "";
  var sorted = Object.entries(data).sort((a,b)=>b[1]-a[1]);
  sorted.forEach(function(d){
    html += "<div>"+d[0]+" : "+d[1]+" toggles</div>";
  });
  document.getElementById("leaderboard").innerHTML = html;
});
</script>

</body>
</html>
