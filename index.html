<!DOCTYPE html>
<html>
<head>
  <title>NodeMCU LED Control</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>
  <style>
    body{
      margin:0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg,#1f4037,#99f2c8);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:#333;
    }
    .container{
      background:#ffffff;
      width:380px;
      border-radius:15px;
      box-shadow:0 15px 40px rgba(0,0,0,0.25);
      padding:30px;
      text-align:center;
    }
    h2{
      margin-bottom:25px;
      color:#1f4037;
    }
    .card{
      background:#f7f7f7;
      padding:20px;
      border-radius:12px;
      margin-bottom:20px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.08);
    }
    .status{
      font-size:18px;
      margin-bottom:15px;
      font-weight:bold;
    }
    .on{ color:green; }
    .off{ color:red; }

    button{
      padding:10px 18px;
      margin:5px;
      border:none;
      border-radius:8px;
      font-size:14px;
      cursor:pointer;
      transition:0.3s;
      color:white;
    }
    .onbtn{ background:#28a745; }
    .offbtn{ background:#dc3545; }
    button:hover{
      transform:scale(1.05);
      opacity:0.9;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Realtime LED Control</h2>

  <div class="card">
    <div id="led1status" class="status">LED1 Status</div>
    <button class="onbtn" onclick="setLED('led1',0)">LED1 ON</button>
    <button class="offbtn" onclick="setLED('led1',1)">LED1 OFF</button>
  </div>

  <div class="card">
    <div id="led2status" class="status">LED2 Status</div>
    <button class="onbtn" onclick="setLED('led2',0)">LED2 ON</button>
    <button class="offbtn" onclick="setLED('led2',1)">LED2 OFF</button>
  </div>
</div>

<script>
var firebaseConfig = {
  databaseURL: "https://nodemcu-92161-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

function setLED(led, state){
  db.ref(led).set(state);
}

db.ref("led1").on("value", function(snapshot){
  var el = document.getElementById("led1status");
  if(snapshot.val()){
    el.innerHTML = "LED1 is ON";
    el.className = "status on";
  }else{
    el.innerHTML = "LED1 is OFF";
    el.className = "status off";
  }
});

db.ref("led2").on("value", function(snapshot){
  var el = document.getElementById("led2status");
  if(snapshot.val()){
    el.innerHTML = "LED2 is ON";
    el.className = "status on";
  }else{
    el.innerHTML = "LED2 is OFF";
    el.className = "status off";
  }
});
</script>

</body>
</html>
